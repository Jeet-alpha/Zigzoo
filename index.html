<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zigzoo</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="navbar">
        <img src="Zigzoo_logo.png" class="logo";>
        <div class="search-bar">
            <input class="input1" type="text" placeholder="Search what ever you want">
            <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="nav-actins">
            <button class="btn2">ask AI</button>
            <button class="btn3"><span><i class="fa-solid fa-cart-shopping"></i><span class="cart-count">0</span></span></button>
        </div>
        <div>
            <button class="btn4">X</button>
        </div>
    </div>
    <div class="line1"></div>
    <!-- catrgories-section -->
    <div class="categories">
        <button class="For-You">For You</button>
        <button class="Mobiles">Mobiles</button>
        <button class="Laptops">Laptops</button>
        <button class="Electronics">Electronics</button>
        <button class="Fashion">Fashion</button>
        <button class="Beauty">Beauty</button>
        <button class="Furniture">Furniture</button>
        <button class="Books">Books</button>
        <button class="Toys">Toys</button>
    </div>
    <div class="line2"></div>
    <header>
        <section class="main-banner">
            <span><h3 class="paragraph-1">FESTIVE SEASON SPECIAL</h3></span>
            <span><h1 class="paragraph-2">Delightful choices, honest value.</h1></span>
            <h5 class="paragraph-3">Skip the overwhelming supermarket catalogs. We curate top-rated everyday gadgets, comfortable fashion, and festival goodies with honest pricing.</h5>
            <img src="smart-watch.png" alt="A smart watch image" class="main-banner-image">
            <button class="banner-btn">SHOP NOW</button>
        </section>
    </header>
    
</body>
</html>
